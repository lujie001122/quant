# ═══════════════════════════════════════════════════════════════════
# 策略模式（2026-11-17 起）
#   chase   = 追涨杀跌：纯动量分位 + 510300 空仓开关 + 主题上限 + ATR 网格 + ATR 跟踪止损（默认）
#   flow    = E4 终局方案：等权宽组合 20 只 + 流量倾斜 + 溢价风控 + 低换手
#   pyramid = 旧的集中金字塔 top5 周轮动（研究已证否：年化 4.75%/回撤 27%，仅留一键回退）
# 切换: python3 signal_generator.py --mode=flow / --mode=pyramid / --mode=chase
# ═══════════════════════════════════════════════════════════════════
strategy:
  mode: chase

# ── 追涨杀跌参数（research/chase@988da00 冻结；回测=实盘同一份，改这里两边一起变）──
# 唯一实现在 chase_live.py：回测 chase_live.py --backtest / 实盘 signal_generator.py --mode=chase
#
# ★ 2026-11-17 客户定档「买定离手·极致版」（research/extreme 配置 1，已接进实盘）★
#   只持 1 只 ｜ 每 3 个交易日决策（固定锚点，非周频）｜ 缓冲带 0.70 ｜ 空仓开关开(ma60)
#   不设：止损、网格、赛道上限、相关性簇、跌幅熔断 ｜ 同指数去重保留 ｜ 成本 0.1% 单边
#   实测（chase_live.py --backtest / --phases，phase=1）：
#     3y 年化 88.84% 回撤 -29.6% 换手 15.0%/周 成本 1.52%/年 平均持仓 0.54 只 23 笔
#     5y 年化 42.30% 回撤 -29.6% 换手 15.6%/周 成本 1.68%/年 平均持仓 0.45 只 42 笔
#   下面每个键都写了「换档的实测代价」（同参数只改这一项，3y/5y 年化），旧口径注释一行没删。
#   ⚠️ 已知冲突（未改，需单独定档）：执行层 risk.single_position_cap=0.50 会把单票压到 50%，
#      而 N=1 的目标就是 100%。那个键被 flow/pyramid 共用，改它会波及旧分支，所以此处只记录。
chase:
  n_hold: 1              # 目标持仓只数（本档 1 = 单吊；旧宽组合口径 8 只）
                         # 实测（其余参数同本档，只改 n_hold）：
                         #   1 → 88.84% / 42.30%（本档）
                         #   2 → 55.79% / 27.10%（回撤 -28.6%，最坏单日 -10.89%）
                         #   4 → 42.45% / 19.85%（回撤 -23.8%，最坏单日 -9.34%）
                         #   8 → 31.92% / 15.27%（回撤 -22.5%，最坏单日 -8.30%）
                         # 收益几乎全来自「只持 1 只」：多一只少 33pp，这是花钱买分散。
  # ── 决策频率：固定锚点「每 N 个交易日」，不是周频、更不是「距上次运行几天」──
  decide_every: 3        # 3 = 每 3 个交易日一个决策日；0/1 = 退回旧周频（ISO 周最后一天）
                         # 实测：每3日 88.84%/42.30% ｜ 每5日 48.90%/22.69% ｜ 周频 42.62%/15.61%
  decision_anchor: '2015-01-05'  # 序号 0 = 2015 首个交易日；序号由全局交易日历算，回测=实盘
  decision_phase: 1      # 决策日 = (序号-相位) % 3 == 0。三个相位实测：
                         #   0 → 58.83%/29.17%  ｜ 1 → 88.84%/42.30% ←本档 ｜ 2 → 54.83%/26.43%
                         # 相位只是启动偏移，不是可调旋钮：它差 30pp 恰恰说明这套策略对起点极敏感，
                         # 88.84% 是「最好相位」，期望值应看相位中位 58.83%/29.17%。
  market_filter: ma60    # 空仓开关：510300 收盘 < MA60 → 次日开盘清仓、不建仓（日频、优先级最高）
                         # off/false/0 = 关掉。实测关掉 → 3y 16.43%/-66.0%、5y 12.00%/-66.0%（命门）
  spec_stop: false       # 是否启用 ATR 跟踪止损（false = 不设止损，3a 整段不跑）
                         # 实测：false 88.84%，true 88.84%（k=3 一次都没触发，纯空转）；
                         #       把 stop_k 收紧到 1.0 → 66.10%，代价 -22.7pp
  buffer_quantile: 0.70  # 缓冲带：已持有只要动量分位 >= 0.70 就继续持有，掉出才换（≡ 旧 hold_pct）
                         # 实测：0.60 → 79.85%/41.35%（换手 13.1%，但回撤 -32.6%）
                         #       0.70 → 88.84%/42.30%  ←本档
                         #       0.80 → 78.59%/38.34%（换手 15.7%/成本 1.59%，比本档更差）
  # hold_pct: 0.70       # 旧键，已并入 buffer_quantile（同义，只留一个名字，避免双份真相）
  entry_pct: 0.20        # 动量分位门槛：20 日动量截面分位 >= 1-0.20（前 20%）才建仓
  min_hold: 5            # 最短持有交易日（实测 min_hold=0 与本档逐位相同：缓冲带已先挡住）
  max_swap: 0            # 主动换仓额度（0=只在空缺时补位）；N=1 的换仓靠缓冲带掉出，不靠这个
  swap_margin: 0.0       # 主动换仓要求的分位改善幅度
  cooldown: 10           # 止损后同标的冷却交易日（本档不设止损，实际不触发）
  grid: false            # ATR 网格只调权重 0.6~1.4 倍，不改持仓集合
                         # 实测：false 88.84%，true 88.84%（N=1 归一化后权重恒 =1，0 笔成交）
  grid_step: 1.0         # 网格档距 = grid_step × ATR14
  grid_lo: 0.6
  grid_hi: 1.4
  grid_dead: 0.01        # 权重偏离 1% 才动（防碎单）
  stop_k: 3.0            # ATR 跟踪止损：收盘 < 峰值 - 3.0×ATR14 → 卖（spec_stop=false 时不生效）
  stop_freq: weekly      # 止损检查频率（weekly=周频，与验证口径一致）
  exit_mode: atr         # atr | ma20（ma20 已验证为负，别切）
  regime: true           # 旧开关（关掉 → 3y 年化 4.09%，命门）；market_filter 会覆盖它
  index_code: '510300'   # 空仓开关基准
  index_ma: 60           # 空仓开关 MA 周期：510300 收盘 < MA60 → 次日开盘清仓、不建仓
  # ── 同指数去重（2026-11-17 新增）：同一只标的指数只留 T-1 流动性最好的一只 ──
  # 起因：2026-11-17 的次日清单是 5 只机器人ETF(跟踪同一只中证机器人, ρ 0.99~0.998)
  #       +2 只影视ETF(同一只, ρ 0.993)+1 只纳指生物科技 = 名义 8 只，实际只有 3 只指数，
  #       62.5% 仓位押在一条赛道上。主题上限按名称关键词分组，允许 5 只机器人同时进。
  # 识别：名称核心（ETF 之前那段）+ 别名表（IDX_ALIAS）判"同一只指数"，静态、可审计；
  #       相关系数只做验证/拆分（同名组里装着不同指数的泛名组，如 红利/消费/价值），
  #       以及可选的跨名合并兜底（idx_corr_merge，默认关：ρ 高 ≠ 同一指数）。
  # 选谁：组内近 20 日**日均成交额**（T-1 口径，不含当日）最大的那只；holding 侧若同组
  #       多只则留流动性最好的，不因排名互换而主动换仓（省换手）。
  index_cap: 1           # 同一标的指数最多几只（0=关掉去重，回到 2026-11-17 前口径）
                         # 实测 N=1：1 → 88.84%/42.30%；0 → 88.84%/44.73%（5y 反而 +2.4pp）
                         # 客户要求保留（N=1 时"无害"实际上不是零代价：3y 持平、5y -2.4pp）
  idx_corr_window: 60    # 同指数验证/拆分的收益率窗口（交易日，截止 T-1）
  idx_corr_split: 0.90   # 同名组内最低相关 < 该值 → 泛名组，按下面阈值再拆
  idx_corr_sub: 0.97     # 泛名组拆分时的聚类阈值
  idx_corr_merge: 0.0    # >0：不同名但 ρ ≥ 该值 → 合并（兜底档；默认关，理由见上）
  # ── 相关性聚类上限（2026-11-17 实现，2026-11-17 决策：默认关）────────────
  # 做什么：近 idx_corr_window(60) 日前复权日收益（截止 T-1）→ 两两 ρ ≥ corr_threshold
  #         单链接聚成一簇（并查集）→ 每簇最多 corr_cluster_cap 只，超出按动量分位砍尾部。
  # 位置：同指数去重之后、赛道主题上限之前（前三步只剔除，第四步才按分位取满 n_hold 只）。
  # 为什么关（实测，见 audit_corr_cluster_2026-11-17.md）：
  #   单链接会链式传递（A~B、B~C ⇒ 同簇），而 A 股权益之间 ρ 常年 0.9+，ρ≥0.90 切出来的
  #   最大簇是 564/1053 只（池的 53.6%）="A 股 beta 链"，不是"某条产业链"。K=2 于是等价于
  #   【国内权益最多 2 个仓位】：每降 1pp 回撤要付 1.3pp 年化，Calmar 0.65→0.44、夏普 0.78→0.53。
  #   A 无去重(theme5) 3y 19.63%/−32.0%/0.75｜5y 8.15%/−32.1%/0.37
  #   B 同指数去重     3y 18.88%/−29.0%/0.78｜5y 6.85%/−33.4%/0.33   ←采用这一档
  #   C B+相关簇≤2     3y  9.67%/−22.1%/0.53｜5y 2.30%/−29.7%/0.15
  #   要重新评估这层：把它改回 2 即可（一行，别的参数不动）。
  #   N=1 实测：cap=2 与 cap=0 逐位相同（只有 1 只持仓，没有"同簇 2 只"可言）
  corr_threshold: 0.90   # 相关性聚类阈值：两两 ρ ≥ 该值 → 同一簇（单链接）
  corr_cluster_cap: 0    # 0=关闭相关性簇上限（当前）；2=每簇最多 2 只（实测代价见上）
  # 主题上限（2026-11-17 去重后实测 2/3/4/5/6/8/不限 × 3y/5y，最坏单日全部 < -8%）：
  #   去重+6 → 3y 18.88%/5y 6.85%，最坏单日 -7.95%（去重后推荐档）
  #   去重+5 → 16.55%/5.65%（旧上限，去重后偏紧：它拦的是不同指数，不是重复指数）
  #   去重+8 → 19.10%/7.25%（≈不设赛道上限，最坏单日同样 -7.95%）
  # 去重前旧口径留档（2026-11-17 前）：5 → 19.63%/8.15%；6 → 22.83%/10.25% 但 -8.64% 破线
  # ── 2026-11-17 客户决定：接受单吊一个赛道 → theme_cap 6 → 0（不限），index_cap 保持 1 ──
  # 四个版本实测（chase_live.py --pod，回测=实盘同一段 run()）：
  #   V1 参照 theme6/index1        3y 18.88%/-29.0%/最坏单日-7.95%  5y 6.85%/-33.4%
  #   V2 单吊 theme0/index1   ←旧档  3y 19.10%/-29.0%/最坏单日-7.95%  5y 7.25%/-31.9%
  #   V3 强制全仓动量第一赛道       3y 13.37%/-28.0%/最坏单日-8.98%  5y 4.13%/-28.0%
  #   V4 单吊+集中4只               3y 18.72%/-32.7%/最坏单日-8.62%  5y 5.92%/-38.2%
  # 关键事实：index_cap=1 已经把"重复买同一个东西"挡掉了，放开 theme_cap 只多 0.22pp（3y）——
  #   真正压住集中度的是同指数去重 + 入场门槛（平均持仓 4.1 只、仓位 50%），不是主题上限。
  # N=1 实测：theme_cap 0/6 逐位相同（只持 1 只，赛道上限永远拦不到）
  theme_cap: 0           # 同主题最多几只（0=不限）
  # 主题模式：cap=按 theme_cap 限赛道（当前）；top1=强制全部仓位进动量第一的赛道（V3，已验证更差）
  theme_mode: cap
  # ── 硬护栏（2026-11-17 新增，单吊专用；默认互关，打开后回测/实盘同一段 run()）──
  # 位置：run() 的 3d 段，收盘判定、次日开盘执行（严格 T-1）。触发次数/代价见 --guard 实测：
  #   单日熔断（T 日组合跌幅 <= -guard_day → T+1 开盘清掉动量分位最弱的一只，并进冷却）：
  #     6% → 3y 18.64%/-29.0%（触发 2 次，代价 -0.46pp）  5y 7.05%/-31.9%（2 次，-0.20pp）
  #     8% / 10% → 0 次触发（组合最坏单日只有 -7.95%，阈值再高就是死旋钮）
  #     4% → 3y 16.02%（7 次，-3.08pp）—— 再往下就变成自伤
  #   赛道崩塌（持有赛道内跌破 MA20 的比例 > 50% → 整体降到半仓；状态式，恢复满仓时补回）：
  #     所有赛道都盯 → 3y 16.02%/-29.6%（46 次，换手 26%/周，代价 -3.08pp，回撤反而更差）
  #     只盯市值≥50%的那条赛道（guard_theme_lead） → 3y 19.18%/-29.9%（20 次，代价 ±0）
  # 旧档 = 熔断 6% + 只盯单吊赛道：3y 17.87%/-29.9%  5y 6.29%/-34.5%（总代价约 1.0pp/年）
  # 注意：回测口径下护栏只能在次日开盘动手，所以它改不了触发当天的亏损（最坏单日仍是 -7.95%）。
  # N=1 实测：guard_day=0.06 → 3y 69.75%/5y 31.82%（-19.1pp/-10.5pp，回撤反而 -34.0%）；
  #           guard_theme=0.5 逐位相同（只有 1 只持仓，没有"过半破 MA20"可言）
  guard_day: 0           # 单日亏损熔断阈值（0=关）
  guard_day_act: weak1   # weak1=清最弱一只 | half=整体减半
  guard_theme: 0         # 赛道崩塌阈值：赛道内破 MA20 比例 > 该值 → 降仓（0=关）
  guard_theme_lead: true # true=只盯市值占比最大的那条赛道（真单吊口径）；false=所有赛道都盯
  guard_theme_min: 0.50  # 最大赛道占市值达到该比例才启用崩塌判定
  guard_scale: 0.5       # 崩塌后的目标仓位倍数（0.5=半仓）
  cost: 0.001            # 回测单边成本（N=1 实测 0.2% 单边 → 3y 85.96%/5y 39.93%，-2.9pp/-2.4pp）
  live_start: '2023-11-17'   # 实盘回放起点（与 3y 验证窗口一致；状态从这天起逐日推进）
  max_order_pct: 1.0     # 单只单次下单上限 = 总资产 100%（N=1 单只目标就是 100%；沿用旧值 15%
                         # 会永远只建 15% 仓位，回测按全额、实盘按 15% = 回测≠实盘）
  min_order_shares: 5000 # trade.py 的股数下限，小于它不下单（避免被抬到 5000 股超买）

# ── 流量宽组合参数（研究已冻结: 2015-2024 净 8.6%/超额 +4.6pp/MDD −30.1%/周换手 14.9%）──
# 警告：这些数字是固定配置跑出来的。按历史调这组参数 = 过拟合（E4: walk-forward 超额归零）。
flow:
  n: 20                  # 持仓只数（等权 1/N）
  smooth_weeks: 2        # 信号平滑窗口（周）：取过去 2 周百分位均值
  buffer_n: 40           # 缓冲带 = 2N：已在持仓只要没跌出前 40 名就不卖
  min_hold_weeks: 2      # 新买入的持有期下限（周），期内不因排名变化卖出
  partial: 0.5           # 分批换仓：每周只换"需要换的一半"（按名称换，不按权重混）
  premium:
    cap: 0.10            # 溢价阈值：不复权收盘 / 净值(T-1) - 1 > 10%
    block_new_only: true # true=只拦新建仓，已有持仓不强制卖（实盘口径）
                         # false=E4 原口径（超阈值整列掩码，含持仓一起出局）
  gross: 1.0             # 目标总仓位（flow 不乘择时档位；按账户总资产算）
  min_amount_daily: 0.0  # 实盘可交易闸门：日均成交额下限（元）。0=关闭=E4 同池。
                         # 打开 2e7 会砍掉约 61% 的池子、把书换成另一个策略
                         # （2015-2024 净 8.6%→6.6%、t 2.54→0.81），研究结论要求关。
  flow_lag: 1            # 份额滞后交易日数：T-1 盘后已公布口径（PIT）
  max_order_pct: 0.05    # 单只单次下单上限 = 总资产 5%（分批建仓，剩余的下一交易日继续）
  limit_buffer_pct: 0.01 # 限价跳空缓冲：买入挂现价+1%、卖出挂现价-1%（夹在涨跌停内）
  cost: 0.0015           # 回测单边成本（E4 口径）
  cancel_pending_at: '14:45'  # 尾盘撤单时点：此后的执行只撤当日未成交挂单，不再下新单
  use_sell_proceeds: true     # 建仓清单资金口径：可用资金 = 现金 + 当日卖出回款
  # ── 波动目标（riskbudget@7604735 唯一有增量的那一层；只减仓、不加杠杆）──
  # 乘数 = min(1, vol_target / 近 vol_window_weeks 周实现波动)，作用于每只的目标金额。
  # 研究: 25% → 年化 8.79%/回撤 −27.6%/Sharpe 0.50；只有 9% 的周真的减仓，其余满仓。
  # 数据不足 MIN_VOL_OBS=12 周 → 按满仓（乘数 1.0）。上限硬编码 1.0，>1 就是杠杆。
  vol_target: 0.25            # 0 = 关掉波动目标（回到 E4 原样，8.47%/−30.1%）
  vol_window_weeks: 26        # 实现波动回看周数

active_ratio: 0.7
atr_high_threshold: 0.05
backtest:
  # 注意: 原来的 periods 表(1y/2y/... 写死 2025-08-01→2026-07-27)已删除。
  # --period=2y/6m/3m 现在按"距今 N 年/月"实时计算, 见 backtest_bt.py main()。
  fee: 5
  risk_free_rate: 0.02
  slippage_pct: 0.001
  trade_end: '2026-06-30'
  trade_start: '2024-07-01'
broker_type: sim
concentrated_mode: true
concentrated_top_n: 5      # 集中持仓 TOP N（研究结论: 3→5, 全期年化 0.29%→7.08%）
concentrated_sizing_n: 3   # 单票资金基数除数：扩到 5 只时单票基数不缩小（对齐实盘固定30%/笔）
# ── 组合层择时（R2）: 510300 三因子打分 → 三档总仓位乘数 ──
# 回测 backtest_bt.py 与实盘 signal_generator.py 共用 timing.py + 这一段配置，口径唯一。
timing:
  enabled: true
  index_code: '510300'      # 大盘状态判定标的（沪深300ETF）
  ma_fast: 20               # 快线周期
  ma_slow: 60               # 慢线周期
  slope_days: 5             # 斜率对比回看的交易日数
  high_window: 60           # 距 N 日最高价回撤
  low_window: 60            # 距 N 日最低价的距离（贴地判据）
  high_dd_pct: 0.05         # 距最高价回撤 < 5% 计 +1
  low_near_pct: 0.03        # 距最低价 < 3% 计 -2
  atr_period: 14            # ATR 周期
