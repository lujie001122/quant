  before_11: '11:00'
  max_retries: 3
  retry_timeout: 120
  t0_sell_full_ratio: 0.2
  t0_sell_half_ratio: 0.1
stop_loss:
  breakeven_margin: 0.02
  breakeven_trigger: 0.3
  daily_loss_limit_pct: 0.2
  float_profit_stop1: 0.0
  float_profit_stop2: 0.05
  float_profit_trigger1: 0.035
  float_profit_trigger2: 0.1
  hard_stop_pct: 0.18
  hard_take_profit_mult: 1.6
  ma20_break_days: 2
  rsi_low_confirm: 35
  tier1_pct: 0.07
  tier1_ratio: 0.8
  tier2_pct: 0.1
  tier2_ratio: 0.5
  tier3_pct: 0.12
t0:
  ma20_slope_buy_cap: -0.005
  ma20_slope_sell_cap: 0.003
  # ── 配对价：比例为主、金额只作参考 ──
  # 目标价差 = max(最小价位×min_ticks, 现价×min_spread_pct)，不再用固定金额反推。
  # 1500股×0.7元 若按 150 元反推 = 0.1元/股(14%)，必被跌停夹死 → 已废弃该算法。
  min_spread_pct: 0.003        # 0.3%：0.7元 ETF ≈ 0.002/股，可成交
  min_spread_amount: 150       # 金额参考值：只记录，不参与定价（不放大价差）
  min_ticks: 2                 # 最小价差至少 N 个最小价位
  pair_atr_multiplier: 1.1
  pair_max_dist_pct: 0.015     # 硬保护：配对价距现价 >1.5% 直接不下单
  limit_margin_ticks: 1        # 硬保护：配对价距涨跌停至少 1 档
  min_spread_abs: 120
  pair_ratio: 0.3
  # 配对价硬边界：当日涨跌幅。判断依据（money_manager._price_limit_pct）：
  #   主板 ETF 10%；科创板 ETF(588/589) 20%；创业板 ETF 20%（159xxx 里的创业板品种，
  #   用内置清单判断，159995/159819 等非创业板仍是 10%）。
  price_limit_pct: 0.10
  # 按代码单独覆盖涨跌幅（优先级最高），如 {"159915": 0.20}
  price_limit_pct_overrides: {}
  # 整份替换"创业板 ETF"清单（不填则用 money_manager.CHINEXT_ETF_CODES）
  # chinext_etf_codes: ["159915", "159949"]
  rsi_buy_max: 50
  rsi_extreme_buy: 25
  rsi_extreme_sell: 75
  rsi_sell_min: 50
  t0_buy_ratio: 0.3
  t0_sell_ratio: 0.1
