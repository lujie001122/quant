# ═══════════════════════════════════════════════════════════════════
# 策略模式（2026-11-17 起）
#   chase   = 追涨杀跌：纯动量分位 + 510300 空仓开关 + 主题上限 + ATR 网格 + ATR 跟踪止损（默认）
#   flow    = E4 终局方案：等权宽组合 20 只 + 流量倾斜 + 溢价风控 + 低换手
#   pyramid = 旧的集中金字塔 top5 周轮动（研究已证否：年化 4.75%/回撤 27%，仅留一键回退）
# 切换: python3 signal_generator.py --mode=flow / --mode=pyramid / --mode=chase
# ═══════════════════════════════════════════════════════════════════
strategy:
  mode: chase

# ── 追涨杀跌参数（research/chase@988da00 冻结；回测=实盘同一份，改这里两边一起变）──
# 唯一实现在 chase_live.py：回测 chase_live.py --backtest / 实盘 signal_generator.py --mode=chase
chase:
  n_hold: 8              # 目标持仓只数
  entry_pct: 0.20        # 动量分位门槛：20 日动量截面分位 >= 1-0.20（前 20%）才建仓
  hold_pct: 0.70         # 缓冲带：已持有只要分位 >= 0.70 就留，跌出前 30% 才卖
  min_hold: 5            # 最短持有交易日
  max_swap: 0            # 每周主动换仓额度（0=只在空缺时补位）
  swap_margin: 0.0       # 主动换仓要求的分位改善幅度
  cooldown: 10           # 止损后同标的冷却交易日
  grid: true             # ATR 网格只调权重 0.6~1.4 倍，不改持仓集合
  grid_step: 1.0         # 网格档距 = grid_step × ATR14
  grid_lo: 0.6
  grid_hi: 1.4
  grid_dead: 0.01        # 权重偏离 1% 才动（防碎单）
  stop_k: 3.0            # ATR 跟踪止损：收盘 < 峰值 - 3.0×ATR14 → 卖
  stop_freq: weekly      # 止损检查频率（weekly=周频，与验证口径一致）
  exit_mode: atr         # atr | ma20（ma20 已验证为负，别切）
  regime: true           # 空仓开关（关掉 → 3y 年化 4.09%，命门）
  index_code: '510300'   # 空仓开关基准
  index_ma: 60           # 空仓开关 MA 周期：510300 收盘 < MA60 → 次日开盘清仓、不建仓
  # 主题上限（2026-11-17 实测 2/3/4/5/6/8/不限 × 3y/5y）：
  #   5 → 3y 19.63%/5y 8.15%，最坏单日 -7.80%（守住 -8% 红线的最高年化）
  #   6 → 22.83%/10.25%，但最坏单日 -8.64%（破线）；8=不限 → 25.40%/11.84%，-9.17%
  #   2 → 17.15%/6.91%，最坏单日 -7.21%（更保守，回撤 -27.7% 最小）
  # 2026-07-02 不限档实录：6 只半导体设备全跌停（占仓 74%），单日 -9.17%、两日 -11.77%
  theme_cap: 5
  cost: 0.001            # 回测单边成本
  live_start: '2023-11-17'   # 实盘回放起点（与 3y 验证窗口一致；状态从这天起逐日推进）
  max_order_pct: 0.15    # 单只单次下单上限 = 总资产 15%（8 只等权 12.5%，首日一次建满）
  min_order_shares: 5000 # trade.py 的股数下限，小于它不下单（避免被抬到 5000 股超买）

# ── 流量宽组合参数（研究已冻结: 2015-2024 净 8.6%/超额 +4.6pp/MDD −30.1%/周换手 14.9%）──
# 警告：这些数字是固定配置跑出来的。按历史调这组参数 = 过拟合（E4: walk-forward 超额归零）。
flow:
  n: 20                  # 持仓只数（等权 1/N）
  smooth_weeks: 2        # 信号平滑窗口（周）：取过去 2 周百分位均值
  buffer_n: 40           # 缓冲带 = 2N：已在持仓只要没跌出前 40 名就不卖
  min_hold_weeks: 2      # 新买入的持有期下限（周），期内不因排名变化卖出
  partial: 0.5           # 分批换仓：每周只换"需要换的一半"（按名称换，不按权重混）
  premium:
    cap: 0.10            # 溢价阈值：不复权收盘 / 净值(T-1) - 1 > 10%
    block_new_only: true # true=只拦新建仓，已有持仓不强制卖（实盘口径）
                         # false=E4 原口径（超阈值整列掩码，含持仓一起出局）
  gross: 1.0             # 目标总仓位（flow 不乘择时档位；按账户总资产算）
  min_amount_daily: 0.0  # 实盘可交易闸门：日均成交额下限（元）。0=关闭=E4 同池。
                         # 打开 2e7 会砍掉约 61% 的池子、把书换成另一个策略
                         # （2015-2024 净 8.6%→6.6%、t 2.54→0.81），研究结论要求关。
  flow_lag: 1            # 份额滞后交易日数：T-1 盘后已公布口径（PIT）
  max_order_pct: 0.05    # 单只单次下单上限 = 总资产 5%（分批建仓，剩余的下一交易日继续）
  limit_buffer_pct: 0.01 # 限价跳空缓冲：买入挂现价+1%、卖出挂现价-1%（夹在涨跌停内）
  cost: 0.0015           # 回测单边成本（E4 口径）
  cancel_pending_at: '14:45'  # 尾盘撤单时点：此后的执行只撤当日未成交挂单，不再下新单
  use_sell_proceeds: true     # 建仓清单资金口径：可用资金 = 现金 + 当日卖出回款
  # ── 波动目标（riskbudget@7604735 唯一有增量的那一层；只减仓、不加杠杆）──
  # 乘数 = min(1, vol_target / 近 vol_window_weeks 周实现波动)，作用于每只的目标金额。
  # 研究: 25% → 年化 8.79%/回撤 −27.6%/Sharpe 0.50；只有 9% 的周真的减仓，其余满仓。
  # 数据不足 MIN_VOL_OBS=12 周 → 按满仓（乘数 1.0）。上限硬编码 1.0，>1 就是杠杆。
  vol_target: 0.25            # 0 = 关掉波动目标（回到 E4 原样，8.47%/−30.1%）
  vol_window_weeks: 26        # 实现波动回看周数

active_ratio: 0.7
atr_high_threshold: 0.05
backtest:
  # 注意: 原来的 periods 表(1y/2y/... 写死 2025-08-01→2026-07-27)已删除。
  # --period=2y/6m/3m 现在按"距今 N 年/月"实时计算, 见 backtest_bt.py main()。
  fee: 5
  risk_free_rate: 0.02
  slippage_pct: 0.001
  trade_end: '2026-06-30'
  trade_start: '2024-07-01'
broker_type: sim
concentrated_mode: true
concentrated_top_n: 5      # 集中持仓 TOP N（研究结论: 3→5, 全期年化 0.29%→7.08%）
concentrated_sizing_n: 3   # 单票资金基数除数：扩到 5 只时单票基数不缩小（对齐实盘固定30%/笔）
# ── 组合层择时（R2）: 510300 三因子打分 → 三档总仓位乘数 ──
# 回测 backtest_bt.py 与实盘 signal_generator.py 共用 timing.py + 这一段配置，口径唯一。
timing:
  enabled: true
  index_code: '510300'      # 大盘状态判定标的（沪深300ETF）
  ma_fast: 20               # 快线周期
  ma_slow: 60               # 慢线周期
  slope_days: 5             # 斜率对比回看的交易日数
  high_window: 60           # 距 N 日最高价回撤
  low_window: 60            # 距 N 日最低价的距离（贴地判据）
  high_dd_pct: 0.05         # 距最高价回撤 < 5% 计 +1
  low_near_pct: 0.03        # 距最低价 < 3% 计 -2
  atr_period: 14            # ATR 周期
  atr_window: 120           # ATR 中位数回看窗口
  atr_spike_mult: 1.5       # ATR > 1.5×中位数 计 -1
  score_full: 2             # 得分 >= 2 → 满档
  score_mid: 0              # 得分 >= 0 → 中档
  levels: [0.5, 0.8, 1.0]   # 三档总仓位乘数（低/中/满）
  gross: 0.90               # 满档目标总仓位
  trim: true                # 档位下调时按比例减持，把总仓位压到 gross×档位
  trim_band: 0.10           # 超目标 10 个百分点以内不调仓
  insufficient_level: 1.0   # 指数历史不足时的兜底档位
# ── 数据口径 ──
data:
  # 腾讯前复权日K本地缓存（回测优先读，保证可复现；缓存缺失的标的才走实时接口）
  kline_qfq_cache: data/kline_qfq
